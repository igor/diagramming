<div id="stage">
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 720 360" role="img">
  <title>Convergence: two drafts merge into one summary</title>
  <desc>720 × 360 scene, 8 seconds. A "Draft A" box sits upper left and a "Draft B" box lower left; a "Summary" record sits right. Two corridor arrows point from each draft into the record's left edge at separate rows. A small emphasis chip leaves Draft A at 1s and stops at the record edge at 2.4s; a second chip leaves Draft B at 2s and stops at 3.4s; between 3.6s and 4.0s the record's empty "Merged" slot fills with the emphasis color behind its dark label and stays filled through 8s. Base markup is the complete final state; animation starts on document load and does not loop.</desc>

  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <!-- heading + caption -->
  <text x="24" y="40" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Convergence</text>
  <text x="24" y="64" font-family="IBM Plex Sans" font-size="14" fill="#4B5563">Two drafts merge into one summary record.</text>
  <!-- draft A -->
  <rect x="24" y="112" width="176" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="40" y="160" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Draft A</text>
  <text x="40" y="184" font-family="IBM Plex Mono" font-size="14" fill="#4B5563">source</text>
  <!-- draft B -->
  <rect x="24" y="208" width="176" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="40" y="256" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Draft B</text>
  <text x="40" y="280" font-family="IBM Plex Mono" font-size="14" fill="#4B5563">source</text>
  <!-- corridor A -->
  <line x1="200" y1="160" x2="412" y2="160" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 152 L 424 160 L 412 168 Z" fill="#6B7280"/>
  <!-- corridor B -->
  <line x1="200" y1="256" x2="412" y2="256" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 248 L 424 256 L 412 264 Z" fill="#6B7280"/>
  <!-- summary record -->
  <rect x="424" y="128" width="272" height="160" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="440" y="160" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Summary</text>
  <!-- Merged row: empty slot fills after both chips land -->
  <rect x="440" y="192" width="120" height="32" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4" opacity="0" style="fill: none; fill-opacity: 1; fill-rule: nonzero; stroke: rgb(107, 114, 128); stroke-opacity: 1; stroke-width: 2px; stroke-linecap: butt; stroke-linejoin: miter; stroke-dasharray: 4px, 4px; stroke-dashoffset: 0px; opacity: 0; display: inline; visibility: visible; color: rgb(0, 0, 0); font-family: Times; font-size: 16px; font-weight: 400; font-style: normal; letter-spacing: normal; text-anchor: start; dominant-baseline: auto;">

  </rect>
  <text x="448" y="216" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Merged</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 720 360" role="img">
  <title>Convergence: two drafts merge into one summary</title>
  <desc>720 × 360 scene, 8 seconds. A "Draft A" box sits upper left and a "Draft B" box lower left; a "Summary" record sits right. Two corridor arrows point from each draft into the record's left edge at separate rows. A small emphasis chip leaves Draft A at 1s and stops at the record edge at 2.4s; a second chip leaves Draft B at 2s and stops at 3.4s; between 3.6s and 4.0s the record's empty "Merged" slot fills with the emphasis color behind its dark label and stays filled through 8s. Base markup is the complete final state; animation starts on document load and does not loop.</desc>
  <!-- ground -->
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <!-- heading + caption -->
  <text x="24" y="40" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Convergence</text>
  <text x="24" y="64" font-family="IBM Plex Sans" font-size="14" fill="#4B5563">Two drafts merge into one summary record.</text>
  <!-- draft A -->
  <rect x="24" y="112" width="176" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="40" y="160" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Draft A</text>
  <text x="40" y="184" font-family="IBM Plex Mono" font-size="14" fill="#4B5563">source</text>
  <!-- draft B -->
  <rect x="24" y="208" width="176" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="40" y="256" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Draft B</text>
  <text x="40" y="280" font-family="IBM Plex Mono" font-size="14" fill="#4B5563">source</text>

  <line x1="200" y1="160" x2="412" y2="160" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 152 L 424 160 L 412 168 Z" fill="#6B7280"/>
  <!-- corridor B -->
  <line x1="200" y1="256" x2="412" y2="256" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 248 L 424 256 L 412 264 Z" fill="#6B7280"/>
  <!-- summary record -->
  <rect x="424" y="128" width="272" height="160" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="440" y="160" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Summary</text>

  </rect>
  <rect x="440" y="192" width="120" height="32" fill="#DBEAFE" opacity="1">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" calcMode="spline" keySplines="0 0 1 1; 0.22 0.9 0.3 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>
  </rect>

    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.35;1" calcMode="spline" keySplines="0 0 1 1; 0.22 0.9 0.3 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>

<div class="controls" id="controls" hidden>
  <button id="play" aria-label="Play or pause">Play</button>
  <button id="replay" aria-label="Replay from start">Replay</button>
  <label><input type="checkbox" id="slow"> 0.1×</label>
  <button id="before" hidden aria-label="Show the state before arrival">Before</button>
  <button id="after" hidden aria-label="Show the final state">After</button>
  <input id="scrub" type="range" min="0" max="8" step="0.01" value="8" aria-label="Scrub timeline">
  <output id="time" class="t">8.00s</output>
</div>
<p class="hint">Still-first preview: the scene opens on its final state; no autoplay.</p>
</main>
<script>
(function () {
  var DUR = 8;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = null, t = DUR, playing = false, rate = 1, raf = 0, last = 0;
  var stage = document.getElementById('stage');
  var scrub = document.getElementById('scrub'), time = document.getElementById('time');
  var play = document.getElementById('play'), slow = document.getElementById('slow');
  var tpl = document.getElementById('animated');
  if (!stage || !tpl) return;
  svg = tpl.content.querySelector('svg');
  if (!svg) return;
  stage.replaceWith(svg); // swap the frozen still for the live scene
  svg.pauseAnimations();
  svg.setCurrentTime(DUR); // still-first: open on the authored final state
  scrub.max = DUR;
  function fmt(x) { return x.toFixed(2) + 's'; }
  function render() { time.textContent = fmt(t); scrub.value = t; svg.setCurrentTime(t); }
  function stop() { playing = false; play.textContent = 'Play'; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function seekTo(x) { stop(); t = Math.min(DUR, Math.max(0, x)); render(); }
  function frame(now) {
    if (!playing) return;
    var dt = (now - last) / 1000; last = now;
    t = Math.min(DUR, t + dt * rate);
    render(); // end holds: authored freeze holds the final state
    if (t >= DUR) stop(); else raf = requestAnimationFrame(frame);
  }
  if (reduced) {
    // Reduced motion: no continuous playback; offer explicit static before/after
    // plus scrubbing instead.
    play.hidden = true;
    document.getElementById('replay').hidden = true;
    slow.parentElement.hidden = true;
    var before = document.getElementById('before'), after = document.getElementById('after');
    before.hidden = false; after.hidden = false;
    before.onclick = function () { seekTo(0); };
    after.onclick = function () { seekTo(DUR); };
  } else {
    play.onclick = function () {
      if (playing) { stop(); return; }
      if (t >= DUR) t = 0;
      playing = true; play.textContent = 'Pause'; last = performance.now(); raf = requestAnimationFrame(frame);
    };
    document.getElementById('replay').onclick = function () {
      stop(); t = 0; playing = true; play.textContent = 'Pause'; last = performance.now(); raf = requestAnimationFrame(frame);
    };
    slow.onchange = function () { rate = slow.checked ? 0.1 : 1; };
  }
  scrub.addEventListener('input', function () {
    var requested = parseFloat(scrub.value); // capture before stop() re-renders
    seekTo(requested);
  });
  document.getElementById('controls').hidden = false;
  render();
})();
</script>
