<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img">
  <title>Branching: one submission splits into two follow-up paths</title>
  <desc>720 × 360 static scene. A "Submission" box sits left; two corridor arrows leave its right edge at separate rows. The upper corridor, labeled "accepted", points into an "Archive" record whose "stored" slot is filled with the emphasis color; the lower corridor, labeled "needs changes", points into a "Review queue" record whose "open" slot stays empty (dashed). A static diagram: no animation.</desc>
  <!-- ground -->
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <!-- heading + caption -->
  <text x="24" y="40" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Branching</text>
  <text x="24" y="64" font-family="IBM Plex Sans" font-size="14" fill="#4B5563">One submission splits into two follow-up paths.</text>
  <!-- submission -->
  <rect x="24" y="96" width="176" height="176" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="40" y="176" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Submission</text>
  <text x="40" y="200" font-family="IBM Plex Mono" font-size="14" fill="#4B5563">document</text>
  <!-- upper corridor: accepted -->
  <line x1="200" y1="112" x2="412" y2="112" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 104 L 424 112 L 412 120 Z" fill="#6B7280"/>
  <text x="280" y="104" font-family="IBM Plex Sans" font-size="14" fill="#4B5563">accepted</text>
  <!-- lower corridor: needs changes -->
  <line x1="200" y1="256" x2="412" y2="256" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 248 L 424 256 L 412 264 Z" fill="#6B7280"/>
  <text x="280" y="248" font-family="IBM Plex Sans" font-size="14" fill="#4B5563">needs changes</text>
  <!-- archive record -->
  <rect x="424" y="64" width="272" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="440" y="104" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Archive</text>
  <rect x="440" y="112" width="120" height="32" fill="#DBEAFE"/>
  <text x="448" y="136" font-family="IBM Plex Sans" font-size="20" fill="#17212B">stored</text>
  <!-- review queue record -->
  <rect x="424" y="208" width="272" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="440" y="248" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Review queue</text>
  <rect x="440" y="256" width="120" height="32" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="448" y="280" font-family="IBM Plex Sans" font-size="20" fill="#17212B">open</text>
</svg>
