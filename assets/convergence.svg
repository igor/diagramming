<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img">
  <title>Convergence: two drafts merge into one summary</title>
  <desc>720 × 360 scene, 8 seconds. A "Draft A" box sits upper left and a "Draft B" box lower left; a "Summary" record sits right. Two corridor arrows point from each draft into the record's left edge at separate rows. A small emphasis chip leaves Draft A at 1s and stops at the record edge at 2.4s; a second chip leaves Draft B at 2s and stops at 3.4s; between 3.6s and 4.0s the record's empty "Merged" slot fills with the emphasis color behind its dark label and stays filled through 8s. Base markup is the complete final state; animation starts on document load and does not loop.</desc>
  <!-- ground -->
  <rect x="0" y="0" width="720" height="360" fill="#FFFFFF"/>
  <!-- heading + caption -->
  <text x="24" y="40" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Convergence</text>
  <text x="24" y="64" font-family="IBM Plex Sans" font-size="14" fill="#4B5563">Two drafts merge into one summary record.</text>
  <!-- draft A -->
  <rect x="24" y="112" width="176" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="40" y="160" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Draft A</text>
  <text x="40" y="184" font-family="IBM Plex Mono" font-size="14" fill="#4B5563">source</text>
  <!-- draft B -->
  <rect x="24" y="208" width="176" height="96" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="40" y="256" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Draft B</text>
  <text x="40" y="280" font-family="IBM Plex Mono" font-size="14" fill="#4B5563">source</text>
  <!-- corridor A -->
  <line x1="200" y1="160" x2="412" y2="160" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 152 L 424 160 L 412 168 Z" fill="#6B7280"/>
  <!-- corridor B -->
  <line x1="200" y1="256" x2="412" y2="256" stroke="#6B7280" stroke-width="2"/>
  <path d="M 412 248 L 424 256 L 412 264 Z" fill="#6B7280"/>
  <!-- summary record -->
  <rect x="424" y="128" width="272" height="160" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="440" y="160" font-family="IBM Plex Sans" font-size="24" fill="#17212B">Summary</text>
  <!-- Merged row: empty slot fills after both chips land -->
  <rect x="440" y="192" width="120" height="32" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" calcMode="spline" keySplines="0 0 1 1; 0.22 0.9 0.3 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>
  </rect>
  <rect x="440" y="192" width="120" height="32" fill="#DBEAFE" opacity="1">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" calcMode="spline" keySplines="0 0 1 1; 0.22 0.9 0.3 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>
  </rect>
  <text x="448" y="216" font-family="IBM Plex Sans" font-size="20" fill="#17212B">Merged</text>
  <!-- chip A: parks at the record edge -->
  <g id="chip-a" transform="translate(416 160)" opacity="0">
    <rect x="-8" y="-8" width="16" height="16" fill="#DBEAFE" stroke="#17212B" stroke-width="2"/>
    <animateMotion path="M -216 0 L 0 0" keyPoints="0;0;1;1" keyTimes="0;0.125;0.3;1" calcMode="spline" keySplines="0 0 1 1; 0.42 0 0.16 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.35;1" calcMode="spline" keySplines="0 0 1 1; 0.22 0.9 0.3 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>
  </g>
  <!-- chip B -->
  <g id="chip-b" transform="translate(416 256)" opacity="0">
    <rect x="-8" y="-8" width="16" height="16" fill="#DBEAFE" stroke="#17212B" stroke-width="2"/>
    <animateMotion path="M -216 0 L 0 0" keyPoints="0;0;1;1" keyTimes="0;0.25;0.425;1" calcMode="spline" keySplines="0 0 1 1; 0.42 0 0.16 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.425;0.475;1" calcMode="spline" keySplines="0 0 1 1; 0.22 0.9 0.3 1; 0 0 1 1" dur="8s" begin="0s" fill="freeze"/>
  </g>
</svg>
